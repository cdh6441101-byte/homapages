<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14213D">
<title>운동 체크</title>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F6FF;--ink:#14213D;--sub:#6B7794;--card:#fff;--line:#E3E8F5;
--lime:#C6F432;--swim:#00B8D9;--run:#3D5AFE;--push:#FF5A36;--hang:#FFB400}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
.wrap{max-width:520px;margin:0 auto}
header{background:var(--ink);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 16px 14px;border-radius:0 0 26px 26px}
.top{display:flex;align-items:center;justify-content:space-between}
.month{font-family:'Do Hyeon',sans-serif;font-size:28px;letter-spacing:.5px}
.nav{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.12);color:#fff;font-size:22px}
.nav:active{background:rgba(255,255,255,.25)}
.strip{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;width:48px;padding:8px 0 6px;border-radius:16px;background:rgba(255,255,255,.08);color:#fff;text-align:center;position:relative}
.day small{display:block;font-size:11px;opacity:.7}
.day b{display:block;font-size:18px;margin-top:2px}
.day.today b{text-decoration:underline;text-underline-offset:3px}
.day.sel{background:var(--lime);color:var(--ink)}
.day.sel small{opacity:.8}
.day i{display:block;width:5px;height:5px;border-radius:50%;margin:4px auto 0;background:transparent}
.day.has i{background:var(--lime)}
.day.sel.has i{background:var(--ink)}
main{padding:16px}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 2px 0 var(--line)}
h2{font-family:'Do Hyeon',sans-serif;font-weight:400;font-size:20px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:baseline}
h2 span{font-family:'Noto Sans KR',sans-serif;font-size:13px;color:var(--sub);font-weight:500}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.tg{border-radius:18px;padding:16px 8px;border:2px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:92px;justify-content:center;transition:transform .12s}
.tg:active{transform:scale(.96)}
.tg .ic{font-size:28px}
.tg .t{font-weight:700;font-size:15px}
.tg .s{font-size:12px;color:var(--sub)}
.tg.on.swim{background:var(--swim);border-color:var(--swim);color:#fff}
.tg.on.hang{background:var(--hang);border-color:var(--hang);color:var(--ink)}
.tg.on .s{color:inherit;opacity:.85}
.field{border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
.field:last-of-type{margin-bottom:0}
.fh{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:10px}
.fh .ic{font-size:22px}
.row{display:flex;align-items:center;gap:6px}
.row input{flex:1;min-width:0;width:100%;text-align:center;font:700 28px 'Do Hyeon',sans-serif;border:0;background:var(--bg);border-radius:14px;height:52px;color:var(--ink)}
.row input:focus{outline:3px solid var(--lime)}
.unit{font-size:14px;color:var(--sub);width:22px}
.chip{height:52px;min-width:52px;padding:0 8px;border-radius:14px;font-weight:700;font-size:15px;background:var(--bg)}
.chip:active{filter:brightness(.92)}
.run .chip.add{background:var(--run);color:#fff}
.push .chip.add{background:var(--push);color:#fff}
.done-msg{margin-top:12px;text-align:center;font-weight:700;background:var(--lime);border-radius:14px;padding:10px}
.bars{display:flex;align-items:flex-end;gap:2px;height:130px;border-bottom:2px solid var(--line)}
.bar{flex:1;border-radius:4px 4px 0 0;min-height:2px;background:var(--line)}
.bars.run .bar.v{background:var(--run)}
.bars.push .bar.v{background:var(--push)}
.bar.cur{outline:2px solid var(--ink);outline-offset:1px}
.axis{display:flex;gap:2px;margin-top:4px}
.axis span{flex:1;font-size:9px;color:var(--sub);text-align:center;overflow:visible;white-space:nowrap}
.big{font-family:'Do Hyeon',sans-serif;font-size:34px;line-height:1}
.big small{font-size:14px;font-family:'Noto Sans KR',sans-serif;color:var(--sub);margin-left:4px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:12px}
.cal .h{font-size:11px;color:var(--sub);text-align:center}
.cal .d{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;background:var(--bg);color:var(--sub)}
.cal.swim .d.on{background:var(--swim);color:#fff;font-weight:700}
.cal.hang .d.on{background:var(--hang);color:var(--ink);font-weight:700}
.cal .d.cur{outline:2px solid var(--ink);outline-offset:1px}
.tot{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="top">
    <button class="nav" id="prev" aria-label="이전 달">‹</button>
    <div class="month" id="month"></div>
    <button class="nav" id="next" aria-label="다음 달">›</button>
  </div>
  <div class="strip" id="strip"></div>
</header>
<main>
  <section class="card" id="entry"></section>
  <section class="card"><div class="tot"><div><h2 style="margin:0">달리기</h2><div class="big" id="runTot"></div></div><span style="font-size:12px;color:var(--sub)">일별 km</span></div><div class="bars run" id="runBars"></div><div class="axis" id="runAxis"></div></section>
  <section class="card"><div class="tot"><div><h2 style="margin:0">푸시업</h2><div class="big" id="pushTot"></div></div><span style="font-size:12px;color:var(--sub)">일별 개수</span></div><div class="bars push" id="pushBars"></div><div class="axis" id="pushAxis"></div></section>
  <section class="card"><h2>수영<span id="swimCnt"></span></h2><div class="cal swim" id="swimCal"></div></section>
  <section class="card"><h2>매달리기<span id="hangCnt"></span></h2><div class="cal hang" id="hangCal"></div></section>
</main>
</div>
<script>
const KEY='workout-checklist-v1';
let data={};
try{data=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){data={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}}
const pad=n=>String(n).padStart(2,'0');
const key=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);
const WD=['일','월','화','수','목','금','토'];
const now=new Date();
let vy=now.getFullYear(),vm=now.getMonth(),selDay=now.getDate();
const todayKey=key(now.getFullYear(),now.getMonth(),now.getDate());
const empty=()=>({swim:false,run:0,push:0,hang:false});
const get=k=>Object.assign(empty(),data[k]||{});
function set(k,patch){
  const r=Object.assign(get(k),patch);
  r.run=Math.max(0,Math.round((+r.run||0)*10)/10);
  r.push=Math.max(0,Math.round(+r.push||0));
  if(!r.swim&&!r.hang&&!r.run&&!r.push)delete data[k];else data[k]=r;
  save();render(false);
}
const $=id=>document.getElementById(id);
const dim=()=>new Date(vy,vm+1,0).getDate();
const fmt=n=>Number.isInteger(n)?String(n):n.toFixed(1);

function renderStrip(scroll){
  let h='';
  for(let d=1;d<=dim();d++){
    const k=key(vy,vm,d),r=get(k);
    const has=r.swim||r.hang||r.run>0||r.push>0;
    const wd=WD[new Date(vy,vm,d).getDay()];
    h+=`<button class="day${d===selDay?' sel':''}${k===todayKey?' today':''}${has?' has':''}" data-d="${d}"><small>${wd}</small><b>${d}</b><i></i></button>`;
  }
  const s=$('strip');s.innerHTML=h;
  if(scroll){const el=s.querySelector('.sel');if(el)s.scrollLeft=el.offsetLeft-s.clientWidth/2+el.offsetWidth/2}
}

function renderEntry(){
  const k=key(vy,vm,selDay),r=get(k);
  const wd=WD[new Date(vy,vm,selDay).getDay()];
  const all=r.swim&&r.hang&&r.run>0&&r.push>0;
  $('entry').innerHTML=`
  <h2>${vm+1}월 ${selDay}일 (${wd})<span>${k===todayKey?'오늘':''}</span></h2>
  <div class="toggles">
    <button class="tg swim${r.swim?' on':''}" data-t="swim"><span class="ic">🏊</span><span class="t">수영</span><span class="s">${r.swim?'완료':'탭해서 체크'}</span></button>
    <button class="tg hang${r.hang?' on':''}" data-t="hang"><span class="ic">🧗</span><span class="t">매달리기</span><span class="s">${r.hang?'완료':'탭해서 체크'}</span></button>
  </div>
  <div class="field run"><div class="fh"><span class="ic">🏃</span>달리기</div>
    <div class="row"><button class="chip" data-a="run" data-v="-1">−1</button>
    <input id="runIn" type="number" inputmode="decimal" step="0.1" min="0" value="${r.run||''}" placeholder="0"><span class="unit">km</span>
    <button class="chip add" data-a="run" data-v="1">+1</button></div></div>
  <div class="field push"><div class="fh"><span class="ic">💪</span>푸시업</div>
    <div class="row"><button class="chip" data-a="push" data-v="-10">−10</button>
    <input id="pushIn" type="number" inputmode="numeric" step="1" min="0" value="${r.push||''}" placeholder="0"><span class="unit">개</span>
    <button class="chip add" data-a="push" data-v="10">+10</button></div></div>
  ${all?'<div class="done-msg">오늘 운동 4개 모두 완료!</div>':''}`;
}

function renderBars(field,barsId,axisId,totId,unit){
  const n=dim();let vals=[],tot=0;
  for(let d=1;d<=n;d++){const v=get(key(vy,vm,d))[field];vals.push(v);tot+=v}
  const max=Math.max(...vals,field==='run'?5:20);
  $(barsId).innerHTML=vals.map((v,i)=>`<div class="bar${v>0?' v':''}${i+1===selDay?' cur':''}" style="height:${v>0?Math.max(4,v/max*100):2}%" title="${i+1}일 ${fmt(v)}${unit}"></div>`).join('');
  $(axisId).innerHTML=vals.map((_,i)=>`<span>${(i===0||(i+1)%5===0)?i+1:''}</span>`).join('');
  $(totId).innerHTML=fmt(tot)+`<small>${unit} · 이번 달 합계</small>`;
}

function renderCal(field,id,cntId){
  const n=dim(),first=new Date(vy,vm,1).getDay();let cnt=0;
  let h=WD.map(w=>`<div class="h">${w}</div>`).join('')+'<div></div>'.repeat(first);
  for(let d=1;d<=n;d++){const on=get(key(vy,vm,d))[field];if(on)cnt++;h+=`<div class="d${on?' on':''}${d===selDay?' cur':''}">${d}</div>`}
  $(id).innerHTML=h;
  $(cntId).innerHTML=`<span class="big" style="font-size:26px;color:var(--ink)">${cnt}<small>일 했어요</small></span>`;
}

function render(scroll){
  $('month').textContent=vy+'년 '+(vm+1)+'월';
  renderStrip(scroll);renderEntry();
  renderBars('run','runBars','runAxis','runTot','km');
  renderBars('push','pushBars','pushAxis','pushTot','개');
  renderCal('swim','swimCal','swimCnt');renderCal('hang','hangCal','hangCnt');
}

function shift(dm){
  vm+=dm;if(vm<0){vm=11;vy--}if(vm>11){vm=0;vy++}
  selDay=(vy===now.getFullYear()&&vm===now.getMonth())?now.getDate():1;
  render(true);
}
$('prev').onclick=()=>shift(-1);
$('next').onclick=()=>shift(1);
$('strip').onclick=e=>{const b=e.target.closest('.day');if(b){selDay=+b.dataset.d;render(true)}};
$('entry').onclick=e=>{
  const k=key(vy,vm,selDay),r=get(k);
  const t=e.target.closest('[data-t]');
  if(t){set(k,{[t.dataset.t]:!r[t.dataset.t]});return}
  const a=e.target.closest('[data-a]');
  if(a){set(k,{[a.dataset.a]:r[a.dataset.a]+parseFloat(a.dataset.v)})}
};
$('entry').addEventListener('change',e=>{
  const k=key(vy,vm,selDay);
  if(e.target.id==='runIn')set(k,{run:parseFloat(e.target.value)||0});
  if(e.target.id==='pushIn')set(k,{push:parseInt(e.target.value,10)||0});
});
render(true);
</script>
</body>
</html>
